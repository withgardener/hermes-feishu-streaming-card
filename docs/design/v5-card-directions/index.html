<main>
  <header class="page"><div><div class="eyebrow">HERMES / CARD PREVIEW</div><h1>卡片更清楚，过程不打扰</h1><p class="caption">同一份示例内容，对比 A「阅读优先」与 B「任务分区」。可切换执行、审批、结果等九种状态。这里是设计样稿，尚未修改正式卡片；飞书真实外观另行验收。</p></div><a class="export" href="cards.json" download>下载 Card JSON</a></header>
  <section class="toolbar" aria-label="预览选项">
    <label>场景 <select id="scenario" aria-label="卡片场景"></select></label>
    <label>宽度 <select id="viewport" aria-label="模拟设备宽度"><option value="desktop">桌面</option><option value="mobile">手机</option></select></label>
    <button class="toggle" id="theme" type="button">切换深色</button>
    <span class="caption end">仅预览 · 卡片按钮不会提交</span>
  </section>
  <section class="stage" id="stage" aria-label="布局对比"></section>
  <details class="settings"><summary>查看设计差异与边界</summary><div class="inside"><p class="caption">A 更适合日常问答与长结果；B 更适合经常追踪执行步骤的用户。完整内容相同，差异在首屏强调与过程的展开方式。</p><pre id="settings"></pre></div></details>
</main>

<script>
const data=JSON.parse(document.querySelector('#preview-data').textContent);
const el=(tag,cls='',text='')=>{const n=document.createElement(tag);n.className=cls;n.textContent=text;return n};
const escapeText=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){
  let t=escapeText(s);
  t=t.replace(/&lt;text_tag color=(?:&#39;|&quot;)(blue|green|red|orange|purple|indigo|grey|neutral)(?:&#39;|&quot;)&gt;([\s\S]*?)&lt;\/text_tag&gt;/g,'<span class="pill $1">$2</span>');
  t=t.replace(/&lt;font color=(?:&#39;|&quot;)?[\w-]+(?:&#39;|&quot;)?&gt;([\s\S]*?)&lt;\/font&gt;/g,'$1');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\x60([^\x60]+)\x60/g,'<code>$1</code>');
  return t;
}
function markdown(s){
  const n=el('div','md'),lines=String(s??'').split('\n');let code=null,list=null;
  const cells=line=>line.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(c=>c.trim().replace(/\\\|/g,'|'));
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(line.startsWith(String.fromCharCode(96,96,96))){if(code===null){code=[]}else{const pre=el('pre');pre.append(el('code','',code.join('\n')));n.append(pre);code=null}continue}
    if(code!==null){code.push(line);continue}
    if(!line.trim()){list=null;continue}
    if(line.includes('|')&&i+1<lines.length&&cells(lines[i+1]).every(c=>/^:?-{3,}:?$/.test(c))){
      const wrap=el('div','table-wrap'),table=el('table'),tr=el('tr');
      for(const text of cells(line)){const th=el('th');th.innerHTML=inline(text);tr.append(th)}table.append(tr);i++;
      while(i+1<lines.length&&lines[i+1].includes('|')){const row=el('tr');for(const text of cells(lines[++i])){const td=el('td');td.innerHTML=inline(text);row.append(td)}table.append(row)}
      wrap.append(table);n.append(wrap);list=null;continue;
    }
    const bullet=line.match(/^\s*(?:([-*+])|(\d+)\.)\s+(.+)$/);
    if(bullet){const type=bullet[1]?'ul':'ol';if(!list||list.tagName.toLowerCase()!==type){list=el(type);if(type==='ol')list.start=Number(bullet[2]);n.append(list)}const li=el('li');li.innerHTML=inline(bullet[3]);list.append(li);continue}
    list=null;
    const m=line.match(/^(#{1,4})\s+(.+)$/),quote=line.match(/^>\s?(.*)$/);
    const p=el(m?'h'+Math.min(4,m[1].length+1):quote?'blockquote':'p');
    p.innerHTML=inline(m?m[2]:quote?quote[1]:line);n.append(p);
  }
  if(code!==null){const pre=el('pre');pre.append(el('code','',code.join('\n')));n.append(pre)}
  return n;
}
let styles={},device='pc';
function sizeFor(v){
  if(v?.startsWith('hfc_')){const m=styles[v];v=m?.[device]||m?.default||'normal'}
  return ({'normal':'14px','small':'13px','x-small':'12px','notation':'12px','large':'16px','medium':'14px','heading':'18px','heading-2':'19px','heading-3':'17px','heading-4':'16px'})[v]||'';
}
function node(item){
  if(!item||typeof item!=='object')return el('span');
  let n;
  if(item.tag==='markdown'||item.tag==='plain_text'||item.tag==='lark_md'){
    n=markdown(item.content||'');if(item.element_id==='footer')n.classList.add('footer');const size=sizeFor(item.text_size);if(size)n.style.fontSize=size;return n;
  }
  if(item.tag==='hr')return el('hr');
  if(item.tag==='collapsible_panel'){
    n=el('details','panel');n.open=!!item.expanded;const h=item.header||{};n.append(el('summary','',String(h.title?.content||h.title||'执行过程').replace(/^[▸▾]\s*/,'')));
    const inside=el('div','inside');(item.elements||[]).forEach(x=>inside.append(node(x)));n.append(inside);return n;
  }
  if(item.tag==='column_set'){n=el('div','cols');(item.columns||[]).forEach(x=>n.append(node(x)));return n}
  if(item.tag==='button'){n=el('button',['primary','danger'].includes(item.type)?item.type:'',item.text?.content||'选择');n.disabled=true;n.title='离线预览，不会提交';return n}
  if(item.tag==='input'||String(item.tag).startsWith('select_'))return el('div','field',item.placeholder?.content||'输入或选择内容');
  if(item.tag==='table'){
    n=el('div','table-wrap');const table=el('table'),head=el('tr'),columns=item.columns||[];
    columns.forEach(c=>head.append(el('th','',c.display_name||c.name||'')));table.append(head);
    (item.rows||[]).forEach(row=>{const tr=el('tr');columns.forEach(c=>tr.append(el('td','',String(row[c.name]??''))));table.append(tr)});n.append(table);return n;
  }
  n=el('div',item.tag==='column'?'col':item.tag==='action'?'actions':'');
  if(item.text?.content)n.append(markdown(item.text.content));
  (item.elements||item.actions||[]).forEach(x=>n.append(node(x)));return n;
}
function render(){
  const sample=data.scenarios.find(x=>x.id===document.querySelector('#scenario').value)||data.scenarios[0];
  device=document.querySelector('#viewport').value==='mobile'?'mobile':'pc';
  const stage=document.querySelector('#stage');stage.classList.toggle('mobile',device==='mobile');stage.replaceChildren();
  for(const [layout,label] of [['reading','A · 阅读优先（建议）'],['progress','B · 任务分区']]){
    const column=el('div','column'),caption=el('div','rail-label',label);caption.append(el('span','',sample.label));column.append(caption);
    const chat=el('div','chat'),sender=el('div','sender');sender.append(el('div','avatar','H'),el('span','','Hermes · 示例机器人'));chat.append(sender);
    const payload=sample.cards[layout],card=el('article','card');styles=payload.config?.style?.text_size||{};
    if(payload.header){const head=el('div','card-head '+(payload.header.template||''));head.append(el('div','card-title',payload.header.title?.content||''));if(payload.header.subtitle)head.append(el('div','card-subtitle',payload.header.subtitle.content));card.append(head)}
    const body=el('div','card-body');(payload.body?.elements||payload.elements||[]).forEach(x=>body.append(node(x)));card.append(body);chat.append(card);column.append(chat);stage.append(column);
  }
}
const select=document.querySelector('#scenario');data.scenarios.forEach(s=>{const option=el('option','',s.label);option.value=s.id;select.append(option)});
select.addEventListener('change',render);document.querySelector('#viewport').addEventListener('change',render);
document.querySelector('#theme').addEventListener('click',()=>{const dark=document.body.classList.toggle('dark');document.querySelector('#theme').textContent=dark?'切换浅色':'切换深色'});
document.querySelector('#settings').textContent=JSON.stringify(data.configuration,null,2);render();
</script>
